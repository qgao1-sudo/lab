<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Layout Test</title>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            font-family: Arial;
        }
        
        #potion-selector {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            border: 5px solid lime;
        }
        
        #add-beaker-btn {
            position: absolute;
            bottom: 20px;
            left: 120px;
            width: 80px;
            height: 80px;
            background: purple;
            border: 5px solid yellow;
            font-size: 40px;
            border-radius: 15px;
        }
        
        #clear-beakers-btn {
            position: absolute;
            bottom: 120px;
            left: 120px;
            width: 80px;
            height: 80px;
            background: red;
            border: 5px solid yellow;
            font-size: 40px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <h1 style="color: white; text-align: center; padding: 50px;">布局测试页面</h1>
    
    <div id="potion-selector">
        <h2>药水选择器</h2>
        <p>绿色边框</p>
        <p>位置: left: 20px</p>
    </div>
    
    <button id="add-beaker-btn">🧪</button>
    <button id="clear-beakers-btn">🗑️</button>
    
    <div style="color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
        <h2>您应该看到：</h2>
        <ul style="text-align: left;">
            <li>左下角：白色框（绿色边框）- 药水选择器</li>
            <li>它右边稍远：紫色按钮（🧪）和红色按钮（🗑️）垂直排列</li>
            <li>所有按钮都有黄色边框以便识别</li>
        </ul>
    </div>
</body>
</html>
